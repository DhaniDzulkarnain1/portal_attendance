spring:
  application:
    name: portal-attendance
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_attendance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api
